# Lepton dev-pod config for a local 10-iteration PAS CLIP DEFT run.
# Variant of clip_config_lepton_e2e_pas.yaml with lr=1e-7 and train/val
# batch_size=64. Expensive PAS splits/source shards are intended to be reused
# through symlinks under this experiment root.

execution:
  backend: "local"

kratos_namespace: "taofabric"

experiment:
  name: "sean_test"
  results_path: "/data/users/sfarhatsabet/deft/experiments/pas"
  # TAO checkout must include the PAS TAO-FT benchmark evaluator, e.g. thtang/pas-eval.
  # This needs to be a Lepton path since we are running the code in the repo directly from here
  tao_pytorch_root: "/workspace/sashwatm/tao-pytorch"
  # These are on Kratos since they're base configs that are edited then pushed to Lepton
  # However, all the paths within the configs need to be Lepton paths
  train_config: "/data/users/sfarhatsabet/deft/specs/pas/experiment_spec.yaml"
  eval_config: "/data/users/sfarhatsabet/deft/specs/pas/experiment_spec.yaml"
  visualize: true
  visualize_embeddings: false

iteration:
  start: 1
  end: 200

training:
  init_checkpoint: ""
  continual_model: false
  continual_dataset: true
  num_nodes: 1

tao:
  model:
    type: "siglip2-so400m-patch16-256"
    canonicalize_text: false
  train:
    num_epochs: 5
    checkpoint_interval: 1
    validation_interval: 1
    loss_type: "siglip"
    siglip_loss_dist_impl: "gather"
    triplet_loss_weight: 0.5
    triplet_margin: 0.2
    precision: "fp16"
    distributed_strategy: "ddp"
    num_gpus: 8
    num_nodes: 1
    gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    optim:
      optimizer_type: "adamw"
      vision_lr: 1.0e-7
      text_lr: 1.0e-7
      weight_decay: 1.0e-4
      betas: [0.9, 0.95]
      eps: 1.0e-6
      warmup_steps: 5
      scheduler: "cosine"
  dataset:
    train:
      batch_size: 64
      num_workers: 16
      balance_query_types: false
      unique_caption_per_batch: false
    val:
      batch_size: 64
      num_workers: 4
  evaluate:
    batch_size: 32
    num_workers: 8
    num_gpus: 8
    gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  inference:
    batch_size: 32
    num_workers: 8
    num_gpus: 8
    gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]

mining:
  # Need enough candidates to satisfy the 10K pair budget after
  # duplicate image paths collapse and source-pair recovery.
  topn: 100
  knn_metric: "cosine"
  knn_batch_size: 32
  history_aware:
    enabled: true
    replay_fraction: 0.20
  recovery:
    caption_expansion:
      enabled: false
      mode: "nearest"
      max_pairs_per_image_path: 2
      max_expanded_pair_fraction: 0.25
      dedupe_normalized_caption: true
      count_expanded_pairs_toward_target: "auto"

gap_analysis:
  metric_name: "Rank-1"
  weak_attribute_topk: 4
  target_query_count: 10000
  analyze_by_mAP: false
  total_queries_mAP: 768
  queries_per_slice: 256
  query_types: "easy,medium"
  caption_diversity:
    enabled: true
    history_file: "caption_selection_history.json"
    coverage_target: 1.0
    min_unique_texts_per_attribute: 8
    max_rows_per_unique_text: 1
    max_rows_per_image_path: 1

pas:
  train_pairs_source_file: "/data/users/sfarhatsabet/deft/specs/pas/train_pairs.json"
  pool_pairs_source_file: "/data/users/sfarhatsabet/deft/specs/pas/train_pairs.json"
  eval_pairs_source_file: "/data/users/sfarhatsabet/deft/specs/pas/test_pairs.json"
  train_image_dir: "/workspace/datasets/PAS/NVIDIA_PAS_Filtered_06152026_V3.1_tao_ft_metadata_base_plus_val_test_medium_attr_matched_aug/images"
  train_caption_dir: "/workspace/datasets/PAS/NVIDIA_PAS_Filtered_06152026_V3.1_tao_ft_metadata_base_plus_val_test_medium_attr_matched_aug/captions"
  source_image_dir: "/workspace/datasets/PAS/NVIDIA_PAS_Filtered_06152026_V3.1_tao_ft_metadata_base_plus_val_test_medium_attr_matched_aug/images"
  source_caption_dir: "/workspace/datasets/PAS/NVIDIA_PAS_Filtered_06152026_V3.1_tao_ft_metadata_base_plus_val_test_medium_attr_matched_aug/captions"
  eval_image_dir: "/workspace/datasets/PAS/NVIDIA_PAS_Filtered_06152026_V3.1_tao_ft_metadata_base_plus_val_test_medium_attr_matched_aug/images"
  eval_caption_dir: "/workspace/datasets/PAS/NVIDIA_PAS_Filtered_06152026_V3.1_tao_ft_metadata_base_plus_val_test_medium_attr_matched_aug/captions"
  splits_dir: "/data/users/sfarhatsabet/pas/splits/clip_v0_attr_kratos_lr1e-7_bs64_captiondiversity_k100_realOnly"
  seed_exclude_datasets: "CUHK_PEDES,ICFG_PEDES"
  augmented_suffix: "_Aug"
  query_types: "easy,medium,hard,natural_caption,original_captions"
  mining_pool_mode: "real"
  max_seed_rows: 0
  max_aug_pool_rows: 0
  val_sample_size: 512

embedding:
  model: "SigLIP2"
  model_path: "/data/pretrained_models/siglip2-so400m-patch16-256"
  batch_size: 64
  num_gpus: 8

lepton_e2e:
  source_shard_rows: 250000
  source_knn_batch_rows: 32768
  viz_max_samples_per_group: 12
  viz_max_total_samples: 96
  viz_tile_size: 192

local:
  python: "/usr/bin/python"
  tao_entrypoint: "nvidia_tao_pytorch/multimodal/clip/entrypoint/clip.py"
