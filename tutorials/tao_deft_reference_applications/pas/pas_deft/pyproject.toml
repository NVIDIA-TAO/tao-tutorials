[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pas-deft"
version = "0.1.0"
description = "PAS DEFT pipeline utilities — data mining, gap analysis, config generation, and visualization"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
    "omegaconf>=2.3",
    "pandas>=1.5",
    "pyarrow>=10",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "Pillow",
    "toml",
    "torch>=2.0",
]

[tool.setuptools]
packages = ["pas_deft"]
zip-safe = false

[tool.setuptools.package-dir]
"pas_deft" = "."

[tool.setuptools.package-data]
"pas_deft" = ["*.yaml", "py.typed"]
